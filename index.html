<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adeel Zafar | Portfolio</title>
    <link rel="stylesheet" href="portfolio.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
  </head>
  <body>
    <header>
      <button id="change">🌙</button>
      <div id="profile"></div>
      <nav class="desktop-nav">
        <a href="#education">Education</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#tools">Skills</a>
        <a href="#contact">Contact</a>
      </nav>

       <span class="hamburger" onclick="openNav()">&#9776;</span>
    </header>
    <div id="myNav" class="menu">
      <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
      <div class="menu-content">
        <a href="#education" onclick="closeNav()">Education</a>
        <a href="#experience" onclick="closeNav()">Experience</a>
        <a href="#projects" onclick="closeNav()">Projects</a>
        <a href="#tools" onclick="closeNav()">Skills</a>
        <a href="#contact" onclick="closeNav()">Contact</a>
      </div>
    </div>

    <section id="education">
      <h2>Education</h2>
      <div id="edu"></div>
    </section>

    <section id="experience">
      <h2>Experience</h2>
      <div id="exp"></div>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div id="pro"></div>
    </section>

    <section id="tools">
      <h2>Tech & Tools Explored</h2>
      <div class="tool">
        <img src="https://cdn.simpleicons.org/react/61DAFB"  />
        <img src="https://cdn.simpleicons.org/dart/0175C2" />
        <img src="https://cdn.simpleicons.org/flutter/02569B" />
        <img src="https://cdn.simpleicons.org/postman/FF6C37" />
        <img src="https://cdn.simpleicons.org/jira/0052CC"/>
        <img src="https://cdn.simpleicons.org/html5/E34F26"  />
        <img src="https://cdn.simpleicons.org/javascript/F7DF1E" />
        <img src="https://cdn.simpleicons.org/tailwindcss/06B6D4"  />
        <img src="https://cdn.simpleicons.org/cplusplus/00599C"/>
      </div>
    </section>

    <footer id="contact">
      <h2>Any Queries?</h2>
      <form action="https://formspree.io/f/meozbjag" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message"></textarea>
        <button type="submit">Send</button>
      </form>

      <h2>Contact</h2>
      <div id="fot"></div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
